name: ⭐ Feature request
description: Suggest an improvement to Yomira
labels: [feature request]
body:
  - type: markdown
    attributes:
      value: Yomira is an independent Suwayomi client forked from Komikku. Please report fork-specific requests here.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the problem or reading workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: Include examples or screenshots if helpful.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
# KMK <--

name: 🐞 Issue report
description: Report an issue in Yomira
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use the [latest Yomira release](https://github.com/MathisVerstrepen/komikku-suwayomi/releases/latest).
        Yomira is an independent fork of Komikku; report fork issues here, rather than to upstream maintainers.
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Tap…
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: yomira-version
    attributes:
      label: Yomira version
      description: More → About. For a development build, include the commit.
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Suwayomi server version and authentication mode
      placeholder: e.g. v2.4.2366, server account
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: textarea
    id: diagnostic-details
    attributes:
      label: Logs, screenshots, and other details
      description: |
        Crash logs are available under More → Settings → Advanced → Dump crash logs.
        For provider issues, include the server source name and extension version.
        Remove passwords, tokens, private URLs, and personal data before sharing.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar reports.
          required: true
# KMK <--

name: Release Builder

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Build release without upstream telemetry or updater
        run: ./gradlew assembleRelease
      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest
      - name: Sign and verify APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOMIKKU_RELEASE_ALIAS: ${{ secrets.ALIAS }}
          KOMIKKU_RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KOMIKKU_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          signing_key=$(mktemp)
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$signing_key"
          export KOMIKKU_RELEASE_KEYSTORE="$signing_key"
          scripts/sign_release.sh "$RELEASE_TAG" release-artifacts
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            notes=".github/release-notes/$RELEASE_TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "Yomira $RELEASE_TAG" --notes-file "$notes" --latest
            else
              gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "Yomira $RELEASE_TAG" --generate-notes --latest
            fi
          fi
